name: 🚀 Deploy to Production

on:
  push:
    branches: ["production"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🧩 Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Step 1: Clone or update repository in temporary folder
      - name: 🔄 Clone or Pull Repository
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          TEMP_PATH=${{ secrets.SERVER_PATH }}/repositories/tourist-site;
          if [ -d \$TEMP_PATH/.git ]; then
              cd \$TEMP_PATH && git reset --hard && git pull origin production;
          else
              git clone -b production https://github.com/IslamAlsayed/tourist-site.git \$TEMP_PATH;
          fi
          "

      # Step 2: Copy files to project_root excluding .git and other sensitive files
      - name: 📂 Sync Project Files
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          SRC=${{ secrets.SERVER_PATH }}/repositories/tourist-site
          DST=${{ secrets.SERVER_PATH }}/project_root

          mkdir -p \$DST

          cd \$SRC
          find . -mindepth 1 -not -name '.git' -not -name '.env' -exec cp -r --parents '{}' \$DST \;
          "

      # Step 3: Run migrations
      - name: 🗄️ Migrate Database
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }}/project_root && php artisan migrate --force"

      # Step 4: Run seeders
      - name: 🗄️ Seeders Database
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }}/project_root && php artisan db:seed --force"

      # Step 5: Clear caches
      - name: 🧹 Clear Cache
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }}/project_root && php artisan optimize:clear"

      # Step 6: Optimize
      - name: ⚡ Optimize
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }}/project_root && php artisan optimize"
