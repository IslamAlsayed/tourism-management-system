name: 🚀 Deploy to Production

on:
  push:
    branches: ["production"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🧩 Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Step 1: Clone or update repository in temporary folder
      - name: 🔄 Clone or Pull Repository
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          TEMP_PATH=${{ secrets.SERVER_PATH }}/repositories/tourism-management-system;
          if [ -d \$TEMP_PATH/.git ]; then
              cd \$TEMP_PATH && git reset --hard && git pull origin production;
          else
              git clone -b production https://github.com/IslamAlsayed/tourism-management-system.git \$TEMP_PATH;
          fi
          "

      # Step 2: Copy files to project_root excluding .git and other sensitive files
      - name: 📂 Sync Project Files
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          SRC=${{ secrets.SERVER_PATH }}/repositories/tourism-management-system
          DST=${{ secrets.SERVER_PATH }}/project_root

          mkdir -p \$DST

          cd \$SRC
          find . -mindepth 1 -not -name '.git' -not -name '.env' -exec cp -r --parents '{}' \$DST \;
          "

      # Step 5: Clear caches
      - name: 🧹 Clear Cache
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }}/project_root && php artisan optimize:clear"

      # Step 6: Optimize
      - name: ⚡ Optimize
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }}/project_root && php artisan optimize"

      # Step 7: Copy public assets to public_html
      - name: 📁 Copy Assets to Public HTML
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          PROJECT_PATH=${{ secrets.SERVER_PATH }}/project_root
          PUBLIC_PATH=${{ secrets.SERVER_PATH }}/public_html

          # Create public_html directory if it doesn't exist
          mkdir -p \$PUBLIC_PATH

          # Copy assets folder
          if [ -d \$PROJECT_PATH/public/assets ]; then
              cp -r \$PROJECT_PATH/public/assets \$PUBLIC_PATH/
              echo '✅ Assets folder copied successfully'س
          else
              echo '⚠️ Assets folder not found'
          fi

          # Copy build folder
          if [ -d \$PROJECT_PATH/public/build ]; then
              cp -r \$PROJECT_PATH/public/build \$PUBLIC_PATH/
              echo '✅ Build folder copied successfully'
          else
              echo '⚠️ Build folder not found'
          fi

          # Copy metronic folder
          if [ -d \$PROJECT_PATH/public/metronic ]; then
              cp -r \$PROJECT_PATH/public/metronic \$PUBLIC_PATH/
              echo '✅ Metronic folder copied successfully'
          else
              echo '⚠️ Metronic folder not found'
          fi

          echo '🎉 All public assets copied to public_html successfully!'
          "
