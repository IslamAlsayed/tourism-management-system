name: 🚀 Deploy to Production

on:
  push:
    branches: ["production"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🧩 Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Step 2: Go to project folder
      - name: 📂 Change to project directory
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} " cd ${{ secrets.SERVER_PATH }} && pwd"

      # Step 3: Pull latest code
      - name: 🔄 Git Pull
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} " cd ${{ secrets.SERVER_PATH }} && git pull origin production"

      # Step 4: Run migrations
      - name: 🗄️ Migrate Database
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} " cd ${{ secrets.SERVER_PATH }} && php artisan migrate --force"

      # Step 5: Clear caches
      - name: 🧹 Clear Cache
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} " cd ${{ secrets.SERVER_PATH }} && php artisan optimize:clear"

      # Step 6: Optimize
      - name: ⚡ Optimize
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} " cd ${{ secrets.SERVER_PATH }} && php artisan optimize"
