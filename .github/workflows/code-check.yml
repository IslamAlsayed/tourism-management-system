name: Code Quality Check

on:
  push:
    branches: [ "emix37", "main" ]
  pull_request:
    branches: [ "emix37", "main" ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: Check PHP Syntax Errors
      run: find app Modules config routes -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null
